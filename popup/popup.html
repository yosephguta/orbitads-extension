<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbitAds</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- ── Header ───────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <span class="logo-orbit">Orbit</span><span class="logo-ads">Ads</span>
    </div>
    <div class="user-info" id="userInfo" style="display:none">
      <span id="userName"></span>
      <button class="btn-link" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <!-- ── Login screen ─────────────────────────────────── -->
  <div class="screen" id="loginScreen">
    <p class="screen-subtitle">Sign in to start generating ads</p>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@dealership.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="error-msg" id="loginError"></div>

    <button class="btn-primary" id="loginBtn">Sign In</button>

    <p class="screen-hint">
      Don't have an account?
      <a href="https://dealersorbit.com" target="_blank">Sign up at dealersorbit.com</a>
    </p>
  </div>

  <!-- ── Empty state ───────────────────────────────────── -->
  <div class="screen" id="emptyScreen" style="display:none">
    <div class="empty-icon">🚗</div>
    <p class="empty-title">No vehicles in queue</p>
    <p class="empty-hint">
      Browse your dealership inventory and click
      <strong>⊕ Import to OrbitAds</strong> on any vehicle to get started.
    </p>
  </div>

  <!-- ── Queue screen ─────────────────────────────────── -->
  <div class="screen" id="queueScreen" style="display:none">
    <div id="resumeBanner" class="resume-banner" style="display:none"></div>
    <div class="queue-header">
      <span id="queueCount"></span>
      <button class="btn-link" id="clearDoneBtn">Clear completed</button>
    </div>
    <div class="theme-row">
      <label for="themeSelect">Ad theme:</label>
      <select id="themeSelect">
        <option value="family">Family</option>
        <option value="outdoorsy">Outdoorsy</option>
        <option value="luxury">Luxury</option>
        <option value="sporty">Sporty</option>
        <option value="commuter">Commuter</option>
        <option value="eco">Eco</option>
        <option value="first_car">First Car</option>
      </select>
    </div>
    <div id="jobList"></div>
  </div>

  <!-- ── Review screen ─────────────────────────────────────── -->
  <div class="screen" id="reviewScreen" style="display:none">
    <div class="review-header">
      <div class="review-header-top">
        <button class="btn-back" id="backBtn">← Back</button>
        <div id="reviewTitle" class="review-title"></div>
      </div>
      <div id="reviewMeta" class="review-meta"></div>
    </div>
    <div class="review-status" id="reviewStatus">
      Classifying photos...
    </div>

    <div class="fb-bar-wrap">
      <div class="fb-bar-label">
        <span>Facebook listing photos</span>
        <span id="fbCount">0 / 20</span>
      </div>
      <div class="fb-bar-track">
        <div class="fb-bar-fill" id="fbBarFill"></div>
      </div>
    </div>

    <div id="reviewSections"></div>

    <div class="review-actions">
      <label class="upload-label">
        <input type="file" id="uploadInput" accept="image/*" multiple style="display:none">
        + Upload photos
      </label>
      <button class="btn-primary" id="generateBtn" disabled>
        Generating photos...
      </button>
    </div>
    <!-- Facebook photo counter bar -->

  </div>
  <script src="popup.js"></script>
</body>

</html>
